<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Realm Rush — Zero Cost Vertical Slice</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#0b1020;font-family:system-ui,sans-serif}#diagnostic{position:fixed;left:8px;bottom:8px;z-index:20;max-width:92vw;padding:6px 9px;border-radius:7px;background:#07101dcc;color:#9ff;font:12px/1.3 ui-monospace,monospace;pointer-events:none}canvas{display:block;width:100%;height:100%}#hud{position:fixed;inset:0;pointer-events:none;color:#fff;text-shadow:0 2px 3px #000}#top{position:absolute;top:14px;left:14px;background:#111a;backdrop-filter:blur(4px);padding:10px 14px;border-radius:10px;font-size:14px;line-height:1.45}#mission{position:absolute;top:14px;right:14px;max-width:310px;background:#111a;padding:10px 14px;border-radius:10px;text-align:right}#help{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);background:#111b;padding:8px 12px;border-radius:9px;font-size:13px}#banner{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);font-size:30px;font-weight:800;text-align:center;opacity:0;transition:.2s}#map{position:absolute;right:14px;bottom:14px;width:180px;height:130px;background:#07101ddd;border:1px solid #7ff;border-radius:8px;display:none}
#touch{display:none;position:fixed;inset:0;pointer-events:none;touch-action:none}#joystick{position:absolute;left:max(22px,env(safe-area-inset-left));bottom:max(24px,env(safe-area-inset-bottom));width:132px;height:132px;border:2px solid #ffffff66;border-radius:50%;background:#10203a99;pointer-events:auto;touch-action:none}.stick{position:absolute;left:41px;top:41px;width:50px;height:50px;border-radius:50%;background:#b8d7ffbb;border:2px solid #fff9;box-sizing:border-box}.touchBtn{position:absolute;width:68px;height:68px;border-radius:50%;border:1px solid #ffffff88;background:#182a4ddd;color:#fff;font-weight:800;font-size:12px;box-shadow:0 3px 12px #0008;pointer-events:auto;touch-action:none;-webkit-user-select:none;user-select:none}.touchBtn:active{background:#536dceee}.jump{right:max(28px,env(safe-area-inset-right));bottom:max(36px,env(safe-area-inset-bottom));}.dash{right:max(112px,calc(env(safe-area-inset-right) + 84px));bottom:max(92px,calc(env(safe-area-inset-bottom) + 58px));}.wall{right:max(28px,env(safe-area-inset-right));bottom:max(124px,calc(env(safe-area-inset-bottom) + 92px));}.lookHint{position:absolute;right:18px;top:50%;color:#fff8;font-size:11px;text-align:right;transform:translateY(-50%);padding:8px;pointer-events:none}@media (pointer:coarse){#touch{display:block}#help{bottom:8px;font-size:11px;max-width:80%;text-align:center}#top,#mission{font-size:12px;padding:8px 10px;max-width:42vw}#mission{top:8px;right:8px}#top{top:8px;left:8px}#banner{font-size:24px}}@media (orientation:portrait) and (pointer:coarse){#help{display:none}.lookHint{top:38%}}
</style></head>
<body><div id="diagnostic" aria-live="polite">Starting Realm Rush…</div><canvas id="game"></canvas><canvas id="map"></canvas><div id="touch" aria-label="Touch controls"><div id="joystick" aria-label="Movement joystick"><div class="stick"></div></div><button class="touchBtn jump" id="jumpBtn">JUMP</button><button class="touchBtn dash" id="dashBtn">DASH</button><button class="touchBtn wall" id="wallBtn">WALL<br>RUN</button><div class="lookHint">Drag the open screen to look</div></div><div id="hud"><div id="top"></div><div id="mission"></div><div id="help">WASD move · Mouse drag turn · Space jump · Shift dash · E interact · R wall-run · M map · P pause</div><div id="banner"></div></div><script src="src/game.js"></script></body></html>
