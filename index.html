  const touchKeys={w:false,a:false,s:false,d:false,r:false};
  let joyId=null, lookId=null, lookX=0;
  function setKey(k,v){touchKeys[k]=v; keys[k]=v || !!keys[k+'_keyboard'];}
  function syncMovement(){for(const k of ['w','a','s','d','r']) keys[k]=!!touchKeys[k] || !!keys[k+'_keyboard'];}
  addEventListener('keydown',e=>{keys[e.key.toLowerCase()+'_keyboard']=true;});
  addEventListener('keyup',e=>{keys[e.key.toLowerCase()+'_keyboard']=false;syncMovement();});
  function joyMove(e){
    const r=joy.getBoundingClientRect(), cx=r.left+r.width/2, cy=r.top+r.height/2;
    let dx=e.clientX-cx, dy=e.clientY-cy, max=r.width*.34, len=Math.hypot(dx,dy);
    if(len>max){dx=dx/len*max;dy=dy/len*max;}
    stick.style.transform=`translate(${dx}px,${dy}px)`;
    const nx=dx/max, ny=dy/max;
    touchKeys.w=ny<-.25; touchKeys.s=ny>.25; touchKeys.a=nx<-.25; touchKeys.d=nx>.25; syncMovement();
  }
  joy.addEventListener('pointerdown',e=>{if(joyId!==null)return;joyId=e.pointerId;joy.setPointerCapture(e.pointerId);joyMove(e);e.preventDefault();});
  joy.addEventListener('pointermove',e=>{if(e.pointerId===joyId)joyMove(e);e.preventDefault();});
  function joyEnd(e){if(e.pointerId!==joyId)return;joyId=null;touchKeys.w=touchKeys.a=touchKeys.s=touchKeys.d=false;stick.style.transform='translate(0,0)';syncMovement();e.preventDefault();}
  joy.addEventListener('pointerup',joyEnd);joy.addEventListener('pointercancel',joyEnd);joy.addEventListener('pointerleave',e=>{if(e.pointerId===joyId)joyEnd(e);});
  function pressButton(btn,down,up){
    btn.addEventListener('pointerdown',e=>{btn.setPointerCapture(e.pointerId);down(e);e.preventDefault();});
    btn.addEventListener('pointerup',e=>{up(e);e.preventDefault();});
    btn.addEventListener('pointercancel',e=>{up(e);e.preventDefault();});
  }
  pressButton(jumpBtn,()=>{if(!paused&&player.ground){player.vz=6;player.ground=false;}},()=>{});
  pressButton(dashBtn,()=>{if(!paused&&player.ability>=1&&player.dash<=0)player.dash=.35;},()=>{});
  pressButton(wallBtn,()=>{touchKeys.r=true;syncMovement();},()=>{touchKeys.r=false;syncMovement();});
  C.addEventListener('pointerdown',e=>{if(e.pointerType==='touch' && e.clientX>viewW*.28){lookId=e.pointerId;lookX=e.clientX;C.setPointerCapture(e.pointerId);e.preventDefault();}});
  C.addEventListener('pointermove',e=>{if(e.pointerId===lookId){player.yaw+=(e.clientX-lookX)*.006;lookX=e.clientX;e.preventDefault();}});
  function lookEnd(e){if(e.pointerId===lookId){lookId=null;e.preventDefault();}}
  C.addEventListener('pointerup',lookEnd);C.addEventListener('pointercancel',lookEnd);
  // Prevent Safari gesture/pinch behavior over the game surface.
  document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});
  document.addEventListener('touchmove',e=>{if(e.target.closest('#touch')||e.target===C)e.preventDefault();},{passive:false});
})();

let last=performance.now();let loopStarted=false;function loop(t){if(!loopStarted){loopStarted=true;diagnostic('Rendering loop started');}let dt=Math.min(.033,(t-last)/1000);last=t;update(dt);draw();requestAnimationFrame(loop)}
